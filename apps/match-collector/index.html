  <style>
    :root {
      --accent: #af52de;

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    .card {

      font-size: 18px;
      font-weight: 700;
      text-decoration: none;
      margin-bottom: 12px;
      transition: transform 0.1s ease, background 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .cta:hover { background: var(--accent-dark); }
    .cta:active { transform: scale(0.98); }
    .secondary {
      display: inline-block;
      color: var(--muted);
      font-size: 15px;
      text-decoration: none;
      padding: 12px;
      border-radius: 8px;
    }
    .secondary:hover { color: var(--accent); }
    .secondary[hidden] { display: none; }

  <script>
    (function() {
      var IOS_URL = "https://apps.apple.com/app/id6462309005";
      var ANDROID_URL = "https://play.google.com/store/apps/details?id=com.staplegames.matchcollector";
      var ua = navigator.userAgent || "";
      var isAndroid = /Android/i.test(ua);
      var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      var primary = document.getElementById("primary-cta");
      var secondary = document.getElementById("secondary-cta");

      function set(target, url, store, label) {
        target.href = url;
        target.dataset.store = store;
        target.textContent = label;
      }

      if (isAndroid) {
        set(primary, ANDROID_URL, "android", "Get it on Google Play");
        set(secondary, IOS_URL, "ios", "Or get it on the App Store");
      } else if (isIOS) {
        // Defaults already point at iOS / Android in that order
      } else {
        // Desktop / unknown — keep iOS primary with Android secondary
      }
    })();
  </script>
